name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: GoReleaser cross build
        run: |
          docker run --rm \
            --env CGO_ENABLED=1 \
            --env GITHUB_TOKEN \
            --env RELEASE_OWNER \
            --env RELEASE_REPO \
            --env RELEASE_BASE_URL \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.3 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
          RELEASE_BASE_URL: https://api.github.com
