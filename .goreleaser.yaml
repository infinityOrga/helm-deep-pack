version: 2

project_name: helm-deep-pack

before:
  hooks:
    - go mod download

builds:
  - id: helm-deep-pack
    main: .
    binary: helm-deep-pack
    env:
      - CGO_ENABLED=1
    overrides:
      - goos: linux
        goarch: arm64
        env: &linuxArm64CgoEnv
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X helm-deep-pack/cmd.version={{ .Version }}
      - -X helm-deep-pack/internal/upgrade.releaseOwner={{ .Env.RELEASE_OWNER }}
      - -X helm-deep-pack/internal/upgrade.releaseRepo={{ .Env.RELEASE_REPO }}
      - -X helm-deep-pack/internal/upgrade.releaseBaseURL={{ .Env.RELEASE_BASE_URL }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  - id: push-images
    main: ./cmd/pushimages
    binary: push_images
    env:
      - CGO_ENABLED=1
    overrides:
      - goos: linux
        goarch: arm64
        env: *linuxArm64CgoEnv
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X helm-deep-pack/cmd/pushimages.version={{ .Version }}
      - -X helm-deep-pack/internal/upgrade.releaseOwner={{ .Env.RELEASE_OWNER }}
      - -X helm-deep-pack/internal/upgrade.releaseRepo={{ .Env.RELEASE_REPO }}
      - -X helm-deep-pack/internal/upgrade.releaseBaseURL={{ .Env.RELEASE_BASE_URL }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - helm-deep-pack
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
  - id: push-images
    name_template: "push_images_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - push-images
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge pull request"

release:
  prerelease: auto
