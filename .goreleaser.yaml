version: 2

project_name: helm-deep-pack

before:
  hooks:
    - go mod download

builds:
  - id: helm-deep-pack
    main: .
    binary: helm-deep-pack
    env: &cgoBuildEnv
      - CGO_ENABLED=1
      - >-
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CC=o64-clang{{- end }}
          {{- if eq .Arch "arm64" }}CC=oa64-clang{{- end }}
        {{- else if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=aarch64-linux-gnu-gcc{{- end }}
        {{- else if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-w64-mingw32-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=/llvm-mingw/bin/aarch64-w64-mingw32-gcc{{- end }}
        {{- end }}
      - >-
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CXX=o64-clang++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=oa64-clang++{{- end }}
        {{- else if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CXX=x86_64-linux-gnu-g++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=aarch64-linux-gnu-g++{{- end }}
        {{- else if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CXX=x86_64-w64-mingw32-g++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=/llvm-mingw/bin/aarch64-w64-mingw32-g++{{- end }}
        {{- end }}
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X helm-deep-pack/cmd.version={{ .Version }}
      - -X helm-deep-pack/internal/upgrade.releaseOwner={{ .Env.RELEASE_OWNER }}
      - -X helm-deep-pack/internal/upgrade.releaseRepo={{ .Env.RELEASE_REPO }}
      - -X helm-deep-pack/internal/upgrade.releaseBaseURL={{ .Env.RELEASE_BASE_URL }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  - id: push-images
    main: ./cmd/pushimages
    binary: push_images
    env: *cgoBuildEnv
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X helm-deep-pack/cmd/pushimages.version={{ .Version }}
      - -X helm-deep-pack/internal/upgrade.releaseOwner={{ .Env.RELEASE_OWNER }}
      - -X helm-deep-pack/internal/upgrade.releaseRepo={{ .Env.RELEASE_REPO }}
      - -X helm-deep-pack/internal/upgrade.releaseBaseURL={{ .Env.RELEASE_BASE_URL }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - helm-deep-pack
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
  - id: push-images
    name_template: "push_images_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - push-images
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge pull request"

release:
  prerelease: auto
